name: Refresh SPY Data

on:
  schedule:
    - cron: '0 18 * * 5'  # Every Friday at 18:00 UTC (after US market close)
  workflow_dispatch:        # Allow manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance pandas scipy numpy

      - name: Fetch fresh SPY chain
        run: python data/fetch_chain.py
        continue-on-error: true
        timeout-minutes: 2

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git add data/SPY_chain.csv
          git diff --staged --quiet && echo "No changes" || git commit -m "chore: refresh SPY_chain.csv [skip ci]" && git push
